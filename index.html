<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сюрприз!</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #ffffff;
      text-align: center;
      overflow: hidden;
    }

    .card {
      background: #1e293b;
      padding: 40px 30px;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      max-width: 340px;
      width: 90%;
      transition: transform 0.3s ease;
    }

    .star-icon {
      width: 110px;
      height: 110px;
      margin-bottom: 20px;
      animation: bounce 1.5s infinite ease-in-out;
    }

    h1 {
      font-size: 24px;
      margin: 0 0 10px;
    }

    p {
      font-size: 16px;
      color: #94a3b8;
      margin: 0;
    }

    .prank-badge {
      display: inline-block;
      background: #ef4444;
      color: white;
      padding: 6px 14px;
      border-radius: 99px;
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 16px;
      text-transform: uppercase;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-10px) scale(1.05); }
    }

    @keyframes pop {
      0% { transform: scale(0.8); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>

  <div class="card" id="card">
    <!-- Сюда можно вставить <img src="star.png" class="star-icon"> -->
    <svg class="star-icon" viewBox="0 0 100 100" fill="none" xmlns="http://w3.org">
      <path d="M50 5L63.5 32.5L93.8 36.9L71.9 58.2L77.1 88.4L50 74.1L22.9 88.4L28.1 58.2L6.2 36.9L36.5 32.5L50 5Z" fill="#FACC15" stroke="#EA580C" stroke-width="6" stroke-linejoin="round"/>
    </svg>
    <h1 id="title">Вам начислено 100 звёзд!</h1>
    <p id="subtitle">Обработка награды...</p>
  </div>

  <script>
    // Через 1.5 секунды (1500 миллисекунд) меняем текст на розыгрыш
    setTimeout(() => {
      const card = document.getElementById('card');
      const title = document.getElementById('title');
      const subtitle = document.getElementById('subtitle');

      card.style.animation = 'pop 0.4s ease';
      title.innerHTML = '<div class="prank-badge">Розыгрыш</div><br>ПОПАЛСЯ! 😂';
      subtitle.textContent = 'Никаких звёзд нет, зато прикол сработал!';
    }, 1500);
  </script>

</body>
</html>
